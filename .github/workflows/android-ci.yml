name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        # actions/setup-java v6.3.0
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.4.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Set up Android SDK
        # android-actions/setup-android v3.2.2
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools platforms;android-37 build-tools;36.0.0

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload unit test results
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        # actions/setup-java v6.3.0
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.4.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Set up Android SDK
        # android-actions/setup-android v3.2.2
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools platforms;android-37 build-tools;36.0.0

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore
          retention-days: 7

  debug-build:
    name: Debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        # actions/setup-java v6.3.0
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.4.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Set up Android SDK
        # android-actions/setup-android v3.2.2
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools platforms;android-37 build-tools;36.0.0

      - name: Compile and assemble Debug
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:assembleDebug

      - name: Upload Debug APK
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7
